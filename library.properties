sentence=Send messages between ESP32 / ESP8266 boards over ESP-NOW without a router: send, broadcast, receive queue, clear tips (ru/kk/en).
paragraph=Simple ESP-NOW for ESP32 and ESP8266. Boards talk directly to each other without a router: send text or a whole struct to a MAC address, broadcast to all boards, read received messages from a queue. Peers are added automatically, delivery is confirmed with wait(), and the same code works on both chips and on old and new ESP32 cores. Explains problems in Russian, Kazakh or English and has diagnose() for a quick check. Needs only the built-in ESP-NOW. Made for classes and kits by Alash Electronics.
